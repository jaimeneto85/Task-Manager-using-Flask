name: Deliver (reusable CD)

# Continuous Delivery, called once per environment from ci.yml. It builds the
# versioned image, pushes it to GitHub Container Registry (GHCR), then rolls it out.
# The `environment` input binds the GitHub Environment, which supplies the scoped
# secrets (SECRET_KEY, DATABASE_URI) and protection rules (e.g. a required reviewer
# on `production`, which pauses the run until approved).
on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (development | staging | production)
        required: true
        type: string

jobs:
  deliver:
    name: Deliver to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write          # push the image to GHCR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags, so `git describe` resolves the version

      - name: Resolve version from git
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/task-manager-using-flask:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/task-manager-using-flask:${{ inputs.environment }}

      - name: Roll out
        env:
          APP_ENV: ${{ inputs.environment }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/task-manager-using-flask:${{ steps.version.outputs.version }}
          echo "Published $IMAGE  (APP_ENV=$APP_ENV)"
          echo "TODO: roll this image out to the ${{ inputs.environment }} environment"
          echo "      (e.g. 'kubectl set image ...', 'docker compose pull && up -d', or an ssh deploy)."
