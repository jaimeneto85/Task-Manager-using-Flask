global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The Flask Task-Manager app, exposing metrics via prometheus-flask-exporter.
  - job_name: "task-manager"
    metrics_path: /metrics
    static_configs:
      - targets: ["web:5000"]

  # Prometheus scraping its own internal metrics.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
