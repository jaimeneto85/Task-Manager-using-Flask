name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    name: Tests, Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Build devcontainer
        run: devcontainer build --workspace-folder .

      - name: Start devcontainer
        run: devcontainer up --workspace-folder .

      - name: Run tests inside devcontainer
        run: devcontainer exec --workspace-folder . python -m pytest --cov-report=xml --junitxml=test-report.xml --html=test-report.html --self-contained-html

      - name: Upload test & coverage reports
        if: always()  # publish the report even when a test fails
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            test-report.html
            test-report.xml
            coverage.xml

      - name: Run Bandit security scan
        # SAST for Python. Auto-loads the .bandit config (tests excluded) and
        # fails the build with a non-zero exit code if any vulnerability is found.
        run: devcontainer exec --workspace-folder . bandit -r .

  dependency-check:
    name: OWASP Dependency-Check (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        # Official OWASP action. Its main branch builds FROM owasp/dependency-check-action:latest,
        # so it always runs the current engine (working NVD API support). For full reproducibility
        # you can pin @main to a specific commit SHA.
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Task-Manager-using-Flask'
          path: '.'
          format: 'HTML'
          out: 'reports'
          # --enableExperimental: enable the Python analyzer (parses requirements*.txt).
          # --failOnCVSS 7:       fail the build on any High/Critical finding (CVSS >= 7.0).
          # --nvdApiKey:          authenticate to the NVD API. Add a free key as the
          #                       NVD_API_KEY repository secret (Settings > Secrets and variables > Actions).
          args: >
            --enableExperimental
            --failOnCVSS 7
            --nvdApiKey ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency-Check report
        if: always()  # publish the report even when the scan fails the build on a vulnerability
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

  zap-dast:
    name: OWASP ZAP (DAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # let the ZAP action open/update a GitHub issue with the findings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Start the Flask app
        # DAST scans a LIVE target, so boot the app first. Run it in the background
        # (no debug/reloader, bound to 0.0.0.0:5000) and wait until it answers HTTP.
        run: |
          PYTHONPATH=todo_project nohup python -c "from todo_project import app; app.run(host='0.0.0.0', port=5000, debug=False)" > app.log 2>&1 &
          echo "Waiting for the app on http://localhost:5000 ..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:5000; then echo "App is up"; exit 0; fi
            sleep 2
          done
          echo "App failed to start:"; cat app.log; exit 1

      - name: ZAP Baseline Scan
        # Runs the ZAP CLI (zap-baseline.py) from the official ghcr.io/zaproxy/zaproxy
        # image against the running app (the action uses --network=host, so localhost works).
        # fail_action=false: report findings (HTML/JSON/MD report uploaded as the "zap_scan"
        # artifact + a GitHub issue) WITHOUT failing the build. Set it to true for a hard gate.
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:5000'
          fail_action: false
          token: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Deployment jobs — one per environment, gated by the pushed branch.
  # Each binds a GitHub Environment (repo Settings > Environments) which holds
  # the environment-scoped secrets (SECRET_KEY, DATABASE_URI) and protection
  # rules (e.g. required reviewers on `production`). Create those Environments
  # in the repo settings before the first deploy. The deploy step itself is a
  # placeholder — drop your real deploy command (build & push image, update the
  # running service, etc.) where indicated.
  # ============================================================================
  deploy-development:
    name: Deploy to Development
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags so `git describe` works
      - name: Resolve version from git
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: Deploy
        env:
          APP_ENV: development
          APP_VERSION: ${{ steps.version.outputs.version }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
        run: |
          echo "Deploying version $APP_VERSION (${GITHUB_SHA::7}) to DEVELOPMENT (APP_ENV=$APP_ENV)"
          echo "TODO: docker build --build-arg APP_VERSION=$APP_VERSION -t <registry>/task-manager:$APP_VERSION . ; then push & update the service."

  deploy-staging:
    name: Deploy to Staging
    needs: [build, dependency-check, zap-dast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags so `git describe` works
      - name: Resolve version from git
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: Deploy
        env:
          APP_ENV: staging
          APP_VERSION: ${{ steps.version.outputs.version }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
        run: |
          echo "Deploying version $APP_VERSION (${GITHUB_SHA::7}) to STAGING (APP_ENV=$APP_ENV)"
          echo "TODO: docker build --build-arg APP_VERSION=$APP_VERSION -t <registry>/task-manager:$APP_VERSION . ; then push & update the service."

  deploy-production:
    name: Deploy to Production
    needs: [build, dependency-check, zap-dast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags so `git describe` works
      - name: Resolve version from git
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: Deploy
        env:
          APP_ENV: production
          APP_VERSION: ${{ steps.version.outputs.version }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
        run: |
          echo "Deploying version $APP_VERSION (${GITHUB_SHA::7}) to PRODUCTION (APP_ENV=$APP_ENV)"
          echo "TODO: docker build --build-arg APP_VERSION=$APP_VERSION -t <registry>/task-manager:$APP_VERSION . ; then push & update the service."
